<style>
:root {
  --bg: #EDEAE1; --fg: #121513; --muted: #565B57; --rule: #D3D0C5; --brass: #7A5C20; --accent: #1D4A3A; --on-accent: #EDEAE1;
  color-scheme: only light;

  --f-body: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; padding: 0 16px; }
::selection { background: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { max-width: 1240px; margin: 0 auto; height: 60px; display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand svg { width: 24px; height: 24px; display: block; }
.brand span { font-family: var(--f-mono); font-variation-settings: "wdth" 87.5; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
main { max-width: 1240px; margin: 0 auto; padding: 96px 0; display: grid; gap: 20px; }
.code { font-family: var(--f-mono); font-variation-settings: "wdth" 80; font-size: 12px; color: var(--muted); margin: 0; }
h1 { font-family: var(--f-mono); font-variation-settings: "wdth" 87.5; font-weight: 600; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
p { margin: 0; max-width: 46ch; color: var(--muted); }
.btn { display: inline-flex; font-family: var(--f-mono); font-variation-settings: "wdth" 87.5; font-size: 13px; font-weight: 500; padding: 12px 18px; border: 1px solid var(--fg); color: var(--fg); background: transparent; text-decoration: none; width: fit-content; margin-top: 12px; }
.btn:hover, .btn:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
</style>

name: pages

# pages is served from the gh-pages branch (legacy source). this job copies the
# site files from main into gh-pages, and the pages build publishes them.
on:
  push:
    branches: [main]
    paths: [index.html, wonders.js, 404.html, robots.txt, sitemap.xml, "assets/**", "results/**", "paper/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect site files
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp index.html wonders.js 404.html robots.txt sitemap.xml "$RUNNER_TEMP/site/"
          cp -r assets "$RUNNER_TEMP/site/"
          for d in results paper; do if [ -d "$d" ]; then cp -r "$d" "$RUNNER_TEMP/site/"; fi; done
          find "$RUNNER_TEMP/site" -name '*.py' -delete
          rm -rf "$RUNNER_TEMP/site/assets/readme"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: push to gh-pages
        run: |
          git config user.name thedhruvhegde
          git config user.email dhegde@umich.edu
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse -q --verify origin/gh-pages >/dev/null; then git checkout -B gh-pages origin/gh-pages; else git checkout --orphan gh-pages; fi
          git rm -rq --ignore-unmatch .
          git clean -fdxq
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "[~] publish site from main ${GITHUB_SHA::7}"
          git push origin gh-pages

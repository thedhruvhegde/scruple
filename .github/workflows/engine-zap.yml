# ZAP baseline scan of the scruple engine API (self-run, passive; docs/trust/PENTEST_SCOPE.md).
#
# This file lives at engine/deploy/github-workflows/zap.yml in the monorepo
# (thedhruvhegde/scruple). GitHub only runs workflows from the repository ROOT, so it
# is copied to .github/workflows/engine-zap.yml there; every path below is relative
# to the repo root and every run step works inside engine/.
#
# What it does: builds the image and starts the API plus PostgreSQL 16 with the
# repository's docker-compose.yml (synthetic baseline only, a random throwaway
# password), mints a read-only `auditor` key so the scan also sees authenticated
# responses, runs the ZAP baseline (spider plus passive rules, no attacks) from the
# HTML console at 127.0.0.1:8000/console/ (the browser-facing surface the passive
# rules are written for; the JSON API is not reached by a spider), uploads the
# report, tears everything down.
#
# Failing: only rules marked FAIL in engine/deploy/zap/rules.tsv fail the run (`-I`
# keeps WARN findings as warnings); every finding is in the uploaded report.
# Actions are pinned to commit SHAs (tag in the comment).
name: engine-zap-baseline

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-zap.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-zap.yml"
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC: new ZAP rules against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-zap-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine
    shell: bash

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: start the api (docker compose, synthetic data only)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="${password}"
          BUILD_COMMIT="${GITHUB_SHA}" docker compose up --detach --build --wait
          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ready

      - name: seed the synthetic baseline and a read-only key
        run: |
          docker compose exec -T api scruple rules > /dev/null
          key="$(docker compose exec -T api scruple keys create \
            --subject zap-baseline --role auditor --expires-days 1 \
            --description 'ci zap baseline (throwaway database)')"
          echo "::add-mask::${key}"
          echo "ZAP_KEY=${key}" >> "$GITHUB_ENV"
          for path in /rules /console/; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${key}" \
              "http://127.0.0.1:8000${path}")" = 200
          done

      - name: zap baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.ZAP_KEY }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        with:
          target: http://127.0.0.1:8000/console/
          rules_file_name: engine/deploy/zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: engine-zap-baseline

      - name: api logs
        if: failure()
        run: docker compose logs --no-color api

      - name: tear down
        if: always()
        run: docker compose down --volumes

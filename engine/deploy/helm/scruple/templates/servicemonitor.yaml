{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "scruple.fullname" . }}
  labels:
    {{- include "scruple.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "scruple.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.tokenSecret.name }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.tokenSecret.name }}
          key: {{ .Values.metrics.tokenSecret.key }}
      {{- end }}
{{- end }}

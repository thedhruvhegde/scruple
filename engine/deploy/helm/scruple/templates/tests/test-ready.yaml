apiVersion: v1
kind: Pod
metadata:
  name: {{ include "scruple.fullname" . }}-test-ready
  labels:
    {{- include "scruple.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "scruple.image" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["python", "-c"]
      args:
        - >-
          import urllib.request;
          urllib.request.urlopen("http://{{ include "scruple.fullname" . }}:{{ .Values.service.port }}/ready", timeout=5)
      resources:
        limits:
          cpu: 100m
          memory: 64Mi

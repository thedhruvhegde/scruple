# Docs site: build docs-site/ with `make docs` (mkdocs --strict) on every push and pull
# request that touches the docs or the API, and publish it to GitHub Pages from main.
#
# Not active: it lives in deploy/github-workflows/, not .github/workflows/. To turn it
# on, the owner copies it to .github/workflows/docs.yml and, in the repository
# settings, sets Pages to "GitHub Actions" as the source. Publishing then needs no
# token: the deploy job uses the Pages OIDC permission below.
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "docs-site/**", "scruple/api/**", "scruple/**/api.py", "pyproject.toml", "uv.lock"]
  pull_request:
    paths: ["docs/**", "docs-site/**", "scruple/api/**", "scruple/**/api.py", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "scruple"
version = "0.1.0"
description = "Simulation and hack-resistant verifiers for agents that move money."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fpdf2>=2.9.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.scripts]
agent-gate = "scruple.cli.main:main"
scruple = "scruple.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
    "hypothesis>=6.170.15",
    "pypdf>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scruple", "agent_gate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N"]
ignore = ["S101", "S311"]  # asserts used sparingly; seeded PRNGs are intentional (no crypto use)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["scruple", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "postgres: needs a PostgreSQL server (throwaway local cluster or SCRUPLE_TEST_POSTGRES_URL)",
]

[tool.coverage.run]
source = ["scruple"]
branch = true

id: real-2025-14838463-delivery-photo-not-my-home
title: Three $390 orders; the delivery photo is not the cardholder's home
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2025-14838463
  product: Checking or savings account
  issue: Managing an account
  company_response: Closed with explanation
  amounts_usd:
  - 390.0
  consumer_says_refunded: 'no'
  merchant_response: provided tracking for one order and a delivery photo
  evidence_mentioned:
  - the merchant's delivery photo
  - the mismatched email
  facts:
  - three $390 debit card charges came from a vendor the cardholder never ordered from
  - the order email does not match the cardholder
  - the delivery photo shows a house that is not theirs
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 10.4 (the narrative names neither)'
  - 'ASSUMPTION: family true_fraud: the cardholder did not make or allow the transaction, taking
    the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  - 'ASSUMPTION: the case is one $390 order'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)(i)
  - 12 CFR 1005.6(b)
  - 12 CFR 1005.11(c)(1)
  reg_note: An unauthorized debit card transfer is an error under 1005.11(a)(1)(i); liability
    is capped by 1005.6(b); the institution investigates within 10 business days or gives provisional
    credit (1005.11(c)(1), (c)(2)).
case:
  network: visa
  reason_code: '10.4'
  family: true_fraud
  amount_minor: 39000
  opened_after_days: 20
  documents:
  - kind: avs_cvv_match
  - kind: device_ip_match
  - kind: delivery_proof
    fields:
      address_matches_cardholder: N
expected:
  action: accept
  resolution: accepted
  why: The merchant's own device and AVS records do not tie the order to the cardholder, so a
    10.4/4837 response has no required evidence (S1); accept true fraud.

id: real-cc-16336111-cancelled-subscription
title: A subscription cancelled by email and phone kept billing monthly
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpbcc2024-16336111
  product: Credit card
  issue: Problem with a purchase shown on your statement
  company_response: Closed with monetary relief
  amounts_usd:
  - 12.0
  consumer_says_refunded: 'no'
  merchant_response: kept billing
  evidence_mentioned: []
  facts:
  - a $12 purchase started a subscription
  - the cardholder cancelled by email and by phone, as the receipt said
  - monthly charges continued and the service was not used
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 13.2 (the narrative names neither)'
  - 'ASSUMPTION: family service_failure: the consumer dispute is valid under the network rules,
    taking the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  - 'ASSUMPTION: the monthly charge is $12.00 (the narrative masks it)'
  regime: reg_z
  regs:
  - 12 CFR 1026.13(a)(1)
  - 12 CFR 1026.12(b)(1)(i)
  reg_note: A charge after the cardholder withdrew permission is, on our reading, credit not made
    to a person with authority (1026.13(a)(1)); 1026.12(b)(1)(i) defines authority.
case:
  network: visa
  reason_code: '13.2'
  family: service_failure
  amount_minor: 1200
  opened_after_days: 20
  documents:
  - kind: terms_acceptance
expected:
  action: accept
  resolution: accepted
  why: The cardholder cancelled before these charges and the merchant holds no record of an uncancelled
    plan, the 13.2/4841 evidence (S1); accept.

- A-16
grounding:
  complaint: cfpbcc2024-15329728
  product: Credit card
  issue: Problem with a purchase shown on your statement
  company_response: Closed with monetary relief
  amounts_usd:
  - 76.0
  consumer_says_refunded: 'no'
  merchant_response: has not refunded although its policy says it will

id: real-2025-13640448-event-not-attended
title: An event ticket the merchant agreed to refund; only part came back
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2025-13640448
  product: Checking or savings account
  issue: Problem with a lender or other company charging your account
  company_response: Closed with explanation
  amounts_usd:
  - 83.0
  - 160.0
  consumer_says_refunded: partly
  merchant_response: said it would refund, then stopped answering
  evidence_mentioned: []
  facts:
  - an online event ticket was bought; extra charges were sought at the door
  - the merchant said it would refund because the cardholder did not attend
  - the bank returned an $83 charge but declined the $160 charge
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 13.6 (the narrative names neither)'
  - 'ASSUMPTION: family service_failure: the consumer dispute is valid under the network rules,
    taking the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)
  reg_note: 1005.11(a)(1) lists the Reg E error types; a dispute about goods or services bought
    with a debit card is not one of them on the text's face (our reading; the official interpretations
    are not shipped), so this one is settled under network rules.
case:
  network: visa
  reason_code: '13.6'
  family: service_failure
  amount_minor: 16000
  opened_after_days: 20
expected:
  action: accept
  resolution: accepted
  why: The goods came back to the merchant and no refund record exists, which is the only answer
    to a credit-not-processed claim (S1); accept rather than contest a valid claim.

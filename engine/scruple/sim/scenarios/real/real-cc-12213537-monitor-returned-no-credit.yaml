id: real-cc-12213537-monitor-returned-no-credit
title: A monitor that did not work was returned and signed for, with no credit
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpbcc2024-12213537
  product: Credit card
  issue: Problem with a purchase shown on your statement
  company_response: Closed with monetary relief
  amounts_usd:
  - 110.0
  consumer_says_refunded: 'no'
  merchant_response: received the return and has not credited it
  evidence_mentioned:
  - return tracking number
  - signature on delivery
  facts:
  - a $110 monitor did not work
  - it was shipped back and signed for at the retailer's facility
  - no credit has been issued
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 13.6 (the narrative names neither)'
  - 'ASSUMPTION: family service_failure: the consumer dispute is valid under the network rules,
    taking the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_z
  regs:
  - 12 CFR 1026.13(a)(3)
  - 12 CFR 1026.12(c)(1)
  reg_note: Returned goods the merchant will not credit are property not accepted by the consumer
    (1026.13(a)(3), our reading); the cardholder may also assert the claim against the issuer
    under 1026.12(c)(1).
case:
  network: visa
  reason_code: '13.6'
  family: service_failure
  amount_minor: 11000
  opened_after_days: 20
expected:
  action: accept
  resolution: accepted
  why: The goods came back to the merchant and no refund record exists, which is the only answer
    to a credit-not-processed claim (S1); accept rather than contest a valid claim.

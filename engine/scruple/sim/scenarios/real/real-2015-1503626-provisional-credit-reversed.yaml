id: real-2015-1503626-provisional-credit-reversed
title: A $1,100 unauthorized debit; provisional credit reversed with no merchant proof
sources:
- S1
- A-15
- A-22
- A-16
grounding:
  complaint: cfpb2015-1503626
  product: Bank account or service
  issue: Using a debit or ATM card
  company_response: Closed with explanation
  amounts_usd:
  - 1100.0
  consumer_says_refunded: 'no'
  merchant_response: no proof shown
  evidence_mentioned: []
  facts:
  - a merchant charged the debit card $1,100 without authorization
  - the bank gave partial provisional credit, then reversed it
  - no proof from the merchant was shown
  assumptions:
  - 'ASSUMPTION: network Mastercard and reason code 4837 (the narrative names neither)'
  - 'ASSUMPTION: family true_fraud: the cardholder did not make or allow the transaction, taking
    the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)(i)
  - 12 CFR 1005.6(b)
  - 12 CFR 1005.11(c)(1)
  reg_note: An unauthorized debit card transfer is an error under 1005.11(a)(1)(i); liability
    is capped by 1005.6(b); the institution investigates within 10 business days or gives provisional
    credit (1005.11(c)(1), (c)(2)).
case:
  network: mastercard
  reason_code: '4837'
  family: true_fraud
  amount_minor: 110000
  opened_after_days: 20
  documents:
  - kind: avs_cvv_match
expected:
  action: accept
  resolution: accepted
  why: The merchant's own device and AVS records do not tie the order to the cardholder, so a
    10.4/4837 response has no required evidence (S1); accept true fraud.

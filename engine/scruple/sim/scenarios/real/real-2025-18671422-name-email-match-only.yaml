id: real-2025-18671422-name-email-match-only
title: A $190 charge matched the name and email but not the phone or address
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2025-18671422
  product: Checking or savings account
  issue: Problem caused by your funds being low
  company_response: Closed with monetary relief
  amounts_usd:
  - 190.0
  consumer_says_refunded: 'no'
  merchant_response: supplied the order's name and email
  evidence_mentioned: []
  facts:
  - a $190 payment was made with the debit card
  - the bank first credited it, then reversed
  - the bank said the name and email matched; the phone number and address did not
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 10.4 (the narrative names neither)'
  - 'ASSUMPTION: family true_fraud: the cardholder did not make or allow the transaction, taking
    the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)(i)
  - 12 CFR 1005.6(b)
  - 12 CFR 1005.11(c)(1)
  reg_note: An unauthorized debit card transfer is an error under 1005.11(a)(1)(i); liability
    is capped by 1005.6(b); the institution investigates within 10 business days or gives provisional
    credit (1005.11(c)(1), (c)(2)).
case:
  network: visa
  reason_code: '10.4'
  family: true_fraud
  amount_minor: 19000
  opened_after_days: 20
  documents:
  - kind: avs_cvv_match
    fields:
      avs: N
  - kind: device_ip_match
expected:
  action: accept
  resolution: accepted
  why: Name and email are not CE 3.0 elements and the address check failed; with no device or
    AVS match the 10.4 evidence is missing (S1, S2), so accept.

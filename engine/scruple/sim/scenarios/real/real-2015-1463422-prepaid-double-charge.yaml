id: real-2015-1463422-prepaid-double-charge
title: A prepaid card was charged about $74 twice; a system problem was admitted
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2015-1463422
  product: Prepaid card
  issue: Unauthorized transactions/trans. issues
  company_response: Closed with explanation
  amounts_usd:
  - 74.0
  consumer_says_refunded: 'no'
  merchant_response: a representative admitted a system problem
  evidence_mentioned: []
  facts:
  - a prepaid card was charged twice, about $74
  - a representative said there was a system problem
  - a supervisor later said the money would not be returned
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 12.6.1 (the narrative names neither)'
  - 'ASSUMPTION: family merchant_error: the merchant made the processing error, taking the narrative
    at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)(ii)
  - 12 CFR 1005.11(c)(1)
  reg_note: A duplicate or wrong-amount debit is an incorrect electronic fund transfer under 1005.11(a)(1)(ii);
    investigation time limits are 1005.11(c).
case:
  network: visa
  reason_code: 12.6.1
  family: merchant_error
  amount_minor: 7400
  opened_after_days: 20
expected:
  action: accept
  resolution: accepted
  why: The merchant has nothing showing two separate sales (S1 asks for the settlement record
    of distinct transactions); the extra charge is owed back, so accept.

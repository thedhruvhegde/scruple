id: real-2025-15313818-membership-after-cancel-request
title: A membership kept billing $52 a month after a cancellation request
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2025-15313818
  product: Checking or savings account
  issue: Problem with a lender or other company charging your account
  company_response: Closed with explanation
  amounts_usd:
  - 52.0
  consumer_says_refunded: 'no'
  merchant_response: offered free time after the complaint
  evidence_mentioned: []
  facts:
  - the consumer asked the merchant to cancel and stop payments
  - $52 was charged for additional months
  - the merchant later offered a cancellation window and free time
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 13.2 (the narrative names neither)'
  - 'ASSUMPTION: family service_failure: the consumer dispute is valid under the network rules,
    taking the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  regime: reg_e
  regs:
  - 12 CFR 1005.11(a)(1)(i)
  - 12 CFR 1005.11(b)(1)
  reg_note: A debit after the consumer revoked the merchant's authority is, on our reading, an
    unauthorized transfer (1005.11(a)(1)(i)); the notice rule is 1005.11(b)(1).
case:
  network: visa
  reason_code: '13.2'
  family: service_failure
  amount_minor: 5200
  opened_after_days: 20
  documents:
  - kind: terms_acceptance
expected:
  action: accept
  resolution: accepted
  why: The cardholder cancelled before these charges and the merchant holds no record of an uncancelled
    plan, the 13.2/4841 evidence (S1); accept.

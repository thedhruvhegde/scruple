id: real-2015-1674643-defective-item-returned
title: A defective item was returned at the seller's request; the promised refund never came
sources:
- S1
- A-15
- A-22
grounding:
  complaint: cfpb2015-1674643
  product: Credit card
  issue: Billing disputes
  company_response: Closed with non-monetary relief
  amounts_usd:
  - 73.0
  - 64.0
  consumer_says_refunded: 'no'
  merchant_response: promised a $64 refund after receiving the return
  evidence_mentioned:
  - seller's email
  - return shipping proof
  - seller's receipt of the return
  facts:
  - a defective item cost $73
  - the seller asked for a return and promised $64 back, less shipping
  - the seller received the return
  - no refund arrived
  assumptions:
  - 'ASSUMPTION: network Visa and reason code 13.6 (the narrative names neither)'
  - 'ASSUMPTION: family service_failure: the consumer dispute is valid under the network rules,
    taking the narrative at face value'
  - 'ASSUMPTION: the CFPB masks dates, so the processing and opening dates are ours'
  - 'ASSUMPTION: the case is the $64 the seller promised'
  regime: reg_z
  regs:
  - 12 CFR 1026.13(a)(3)
  - 12 CFR 1026.12(c)(1)
  reg_note: Returned goods the merchant will not credit are property not accepted by the consumer
    (1026.13(a)(3), our reading); the cardholder may also assert the claim against the issuer
    under 1026.12(c)(1).
case:
  network: visa
  reason_code: '13.6'
  family: service_failure
  amount_minor: 6400
  opened_after_days: 20
expected:
  action: accept
  resolution: accepted
  why: The goods came back to the merchant and no refund record exists, which is the only answer
    to a credit-not-processed claim (S1); accept rather than contest a valid claim.

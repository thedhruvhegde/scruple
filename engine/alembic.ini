# Alembic for the PostgreSQL schema. The URL comes from SCRUPLE_DATABASE_URL
# (or `-x url=...`); never put credentials in this file.
#   SCRUPLE_DATABASE_URL=postgresql://... uv run alembic upgrade head
[alembic]
script_location = %(here)s/scruple/storage/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
